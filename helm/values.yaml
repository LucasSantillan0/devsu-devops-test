
replicaCount: 2

image:
  repository: ghcr.io/lucassantillan0/devsu-devops-test
  pullPolicy: IfNotPresent
  tag: "sha-228ea214d8fbe02016c453bb00bfcb1a53cb1f97"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []

httpRoute:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /health/live
    port: http

readinessProbe:
  httpGet:
    path: /health/live
    port: http

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

config:
  NODE_ENV: "production"
  PORT: "8000"
  DATABASE_PATH: "/data/database.sqlite"

persistence:
  size: 1Gi

volumes: []
volumeMounts:
  - name: sqlite-data
    mountPath: /data


nodeSelector: {}
tolerations: []
affinity: {}
