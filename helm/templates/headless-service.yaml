
apiVersion: v1
kind: Service
metadata:
  name: {{ include "test-api.fullname" . }}-headless
  labels:
    {{- include "test-api.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "test-api.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
